[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/simmzx/mochi"
Repository = "https://github.com/simmzx/mochi"

[project]
name = "mochi"
version = "1.1.0"
description = "Self-evolving multi-agent system for end-to-end AI drug discovery"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "MOCHI contributors"}]
dependencies = ["requests>=2.28", "PyYAML>=6.0"]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]
chemistry = ["rdkit>=2023.9"]
dev = ["pytest>=7.0"]

[project.scripts]
mochi = "mochi.cli:main"

[tool.setuptools.packages.find]
include = ["mochi*"]

[tool.setuptools.package-data]
mochi = ["prompts/*.yaml", "templates/prebuilt/*.yaml", "toolblueprints/*.py"]
